    <script>
window.addEventListener('pagehide', function(){
  var el = document.querySelector('video,audio');
  if (!el) return;
  var pos = Math.floor(el.currentTime);
  if (pos <= 0) return;
  var src = el.currentSrc || el.src;
  if (!src) return;
  var m = src.match(/\/api\/files\/(\d+)\//);
  if (!m) return;
  var id = parseInt(m[1]);
  var dur = el.duration;
  var tok = localStorage.getItem('access_token');
  if (!tok) return;
  fetch('/api/files/' + id + '/progress', {
    method: 'POST',
    headers: {'Content-Type':'application/json','Authorization':'Bearer '+tok},
    body: JSON.stringify({position:pos,duration:Math.floor(dur)||0}),
    keepalive: true
  }).catch(function(){});
});
    </script>
